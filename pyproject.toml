[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "git-grasp"
version = "0.1.0"
description = "A git pre-commit hook that asks you to explain your staged diff before it lands."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Version Control :: Git",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
grasp = "grasp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/grasp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
